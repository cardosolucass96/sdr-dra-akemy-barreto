[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-pipefacil"
version = "0.1.0"
description = "Template para agentes SDR integrados ao CRM Pipefacil."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "langfuse==4.14.1",
    "langchain==1.3.14",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.2",
    "openai==2.54.0",
    "openai-agents==0.20.0",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.31",
    "psycopg[binary,pool]==3.3.4",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.outbound_media" = ["catalog.json", "catalog.example.json"]
"app.api" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.sdr_quality]
source_root = "src/app"
node_root = "src/app/agent/nodes"
complexity_warning = 11
complexity_max = 14
node_complexity_max = 8
node_max_lines = 40
node_max_internal_imports = 4
diff_coverage_minimum = 85.0
