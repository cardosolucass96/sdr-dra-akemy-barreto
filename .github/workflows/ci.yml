name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QUALITY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic quality gate
        run: make quality PYTHON=python RUFF=ruff PYTEST=pytest

      - name: Publish quality evidence
        if: always()
        shell: bash
        run: |
          {
            echo "# Quality gate"
            cat build/quality/python-structure.md 2>/dev/null || true
            cat build/quality/diff-coverage.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.sha }}
          path: |
            build/quality/*.md
            build/quality/coverage.xml
          if-no-files-found: warn

  security:
    name: Dependency security
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip for security audit
        run: python -m pip install --upgrade "pip>=26.2"

      - name: Install runtime and audit dependencies
        run: python -m pip install -e ".[audit]"

      - name: Validate installed dependency graph
        run: python -m pip check

      - name: Audit known vulnerabilities
        run: pip-audit --local --progress-spinner off

  container:
    name: Production container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --pull=false --tag sdr-pipefacil:ci .

      - name: Verify non-root runtime and writable application storage
        shell: bash
        run: |
          configured_user="$(docker image inspect --format '{{.Config.User}}' sdr-pipefacil:ci)"
          test -n "$configured_user"
          test "$configured_user" != "0"
          docker run --rm --entrypoint sh sdr-pipefacil:ci -ceu '
            test "$(id -u)" -ne 0
            test -w /app/.runtime/generated-audio
          '

      - name: Smoke-test application import
        run: docker run --rm --entrypoint python sdr-pipefacil:ci -c "from app.main import create_app; create_app()"

  sync-langfuse-prompts:
    name: Sync prompts to Langfuse production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: langfuse-prompt-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Confirm current main revision
        id: source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          echo "commit_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          if [[ "$checked_out_sha" != "$current_main_sha" ]]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale workflow revision $checked_out_sha; main is $current_main_sha."
            exit 0
          fi
          echo "should_sync=true" >> "$GITHUB_OUTPUT"

      - name: Synchronize and promote prompts
        if: steps.source.outputs.should_sync == 'true'
        env:
          APP_ENV: production
          LANGFUSE_ENABLED: "true"
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          PROMPT_SYNC_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: python scripts/bootstrap_langfuse_prompts.py --promote-production
